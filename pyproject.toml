[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dandelion"
version = "0.1.0"
description = "A shared agent core with CLI and remote assistant interfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dandelion-core>=0.1.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "nuitka",
    "zstandard",
    "ordered-set",
    "pytest",
    "tzdata",
]

# Keep only the active src.cli*, src.remote*, and mk.* namespaces in wheels.
# Explicit discovery prevents stale legacy directories under src/ from leaking.
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.cli*", "src.remote*", "mk", "mk.*"]
exclude = ["*.egg-info", "*.__pycache__"]
namespaces = true
