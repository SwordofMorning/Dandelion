services:
  remote:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DANDELION_DR_TOKEN: ${DANDELION_DR_TOKEN:?Set DANDELION_DR_TOKEN}
      DANDELION_DR_DEVICES: ${DANDELION_DR_DEVICES:-}
      DANDELION_TELEGRAM_TOKEN: ${DANDELION_TELEGRAM_TOKEN:-}
      DANDELION_TELEGRAM_CHATS: ${DANDELION_TELEGRAM_CHATS:-}
      DANDELION_DRIVE_ACCESS_TOKEN: ${DANDELION_DRIVE_ACCESS_TOKEN:-}
      DANDELION_DRIVE_CLIENT_ID: ${DANDELION_DRIVE_CLIENT_ID:-}
      DANDELION_DRIVE_CLIENT_SECRET: ${DANDELION_DRIVE_CLIENT_SECRET:-}
      DANDELION_DRIVE_REFRESH_TOKEN: ${DANDELION_DRIVE_REFRESH_TOKEN:-}
      DANDELION_DRIVE_FOLDER_ID: ${DANDELION_DRIVE_FOLDER_ID:-}
    volumes:
      - remote-data:/data
      - remote-workspace:/workspace
      - ../.env/api.cfg:/run/secrets/api.cfg:ro
    stop_grace_period: 2m

volumes:
  remote-data:
  remote-workspace:
