name: ASCII-Only Check

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  # 1. ASCII Check Job: gate all PRs and pushes targeting master.
  #    Master must stay ASCII-Only across all Python and C/C++ sources
  #    (src/, packages/dandelion-core/src/, mk/, main.py).
  ascii-check:
    name: ASCII-Only Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ASCII-Only Check
        shell: bash
        run: |
          # mk/make.py ascii invokes mk.lib.ascii_check across .py/.cpp/.hpp/.h
          # and exits 1 when any non-ASCII character is detected.
          python3 mk/make.py ascii
