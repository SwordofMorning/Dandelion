name: ASCII-Only Check

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
      - "main"

permissions:
  contents: read

jobs:
  # 1. ASCII Check Job: gate all PRs, pushes (master/main), and release tags.
  #    Repository source/script/workflow files must stay 100% ASCII-Only.
  ascii-check:
    name: ASCII-Only Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ASCII-Only Check
        shell: bash
        run: |
          # mk/make.py ascii invokes mk.lib.ascii_check across .py/.cpp/.hpp/.h/
          # .ps1/.sh/.yml/.yaml/CMakeLists.txt and exits 1 on any non-ASCII char.
          python3 mk/make.py ascii
