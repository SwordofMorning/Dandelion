name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
      - "master"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Meta Job: Calculate version number and tag information
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        env:
          # Pass untrusted ref through env to avoid shell injection via
          # direct expression interpolation (ref names may contain $(), etc.)
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" "$GITHUB_REF_VALUE" || true)

          # If no tag is provided, generate a date-based development version number.
          if [[ $tag != v* ]]; then
            tag="v0.0.0-dev-$(date +%y%m%d)-$(git rev-parse --short HEAD)"
          fi

          # If it is not triggered by a formal release, add the ci suffix.
          if [ "$is_release" != "true" ]; then
             tag="${tag}-ci"
          fi

          # The tag is embedded in archive names: fail early on characters
          # that are not allowed by the archive contract (package.py).
          if ! [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "[-] Tag '$tag' contains characters not allowed in archive names"
            exit 1
          fi

          echo "Computed Tag: $tag"
          echo "Is Release: $is_release"

          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "is_release=$is_release" >> $GITHUB_OUTPUT

  # 2. Test Job: offline contract tests (no compilation). The release job
  #    depends on it, so a direct tag push cannot bypass the Excel golden
  #    fixtures, the archive contract or the --version/--self-test checks.
  #    Runs in a clean venv WITHOUT pandas/numpy (proves they are not needed).
  test:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies (clean venv, no pandas)
        shell: bash
        run: |
          python -m venv .venv-test
          .venv-test/bin/python -m pip install --upgrade pip
          .venv-test/bin/python -m pip install -e .
          if .venv-test/bin/python -c "import importlib.util, sys; sys.exit(0 if any(importlib.util.find_spec(m) for m in ('pandas', 'numpy')) else 1)"; then
            echo "[-] pandas/numpy were pulled into the runtime dependency set"
            .venv-test/bin/python -m pip list
            exit 1
          fi

      - name: ASCII check
        run: .venv-test/bin/python test/ascii_check.py src/ mk/ main.py test/

      - name: Excel golden contract
        run: .venv-test/bin/python test/test_excel_contract.py -v

      - name: Build / release contract
        run: .venv-test/bin/python test/test_build_contract.py -v

  # 3. Build Job: Build Matrix (11 targets, all preserved)
  #    - Windows x86_64      : native host runner (unchanged behavior)
  #    - Linux x86_64        : per-distro Docker builds (glibc compatibility)
  #    - Linux arm64 (aarch64): same Docker flow on the arm64 runner
  #
  # WHY DOCKER PER DISTRO: a Nuitka standalone binary links against the
  # build machine's glibc. Building on a newer distro bakes in newer
  # GLIBC_x.y symbols, so the artifact fails on older distros with
  # "version `GLIBC_x.y' not found". Building inside the target distro's
  # own container guarantees the artifact only needs that distro's glibc.
  #
  # GitHub-hosted runner images only cover 22.04/24.04/(26.04 preview), so
  # older targets (18.04/20.04) MUST be built in Docker containers anyway.
  # Using Docker for ALL Linux targets keeps the pipeline deterministic.
  # BOTH architectures get the full 18.04-26.04 distro list; the runner
  # provides the architecture (x86_64 vs arm64 hardware), the container
  # provides the distro version.
  #
  # Each build job produces ONE final archive (tar.gz / zip) + .sha256,
  # smoke-tests exactly that archive (unpacked into a fresh directory, in the
  # target distro for Linux), and uploads only those two files. The release
  # job re-verifies the digests and attaches the same bytes unchanged.
  build:
    needs: meta
    name: Build ${{ matrix.os_name }} ${{ matrix.arch }}${{ matrix.distro_label }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET_ID: ${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}
      CCACHE_MAXSIZE: 1.5G
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (host runner, Nuitka + MSVC/clcache)
          - os: windows-latest
            os_name: win
            arch: x86_64
            build_mode: host
            distro: ""
            distro_label: ""
          # Linux x86_64: one Docker build per supported Ubuntu version.
          # ubuntu:18.04/20.04 are EOL but their containers still work;
          # docker-build.sh falls back to old-releases.ubuntu.com for apt.
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "18.04"
            distro_label: "-ubuntu18"
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "20.04"
            distro_label: "-ubuntu20"
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "22.04"
            distro_label: "-ubuntu22"
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "24.04"
            distro_label: "-ubuntu24"
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "26.04"
            distro_label: "-ubuntu26"
          # Linux arm64: same Docker flow, native arm64 image on the arm
          # runner (docker pulls the arm64v8 variant automatically). Same
          # full 18.04-26.04 distro list as x86_64.
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "18.04"
            distro_label: "-ubuntu18"
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "20.04"
            distro_label: "-ubuntu20"
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "22.04"
            distro_label: "-ubuntu22"
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "24.04"
            distro_label: "-ubuntu24"
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "26.04"
            distro_label: "-ubuntu26"

    # Nuitka C compilation cache:
    #   - Windows: Nuitka's built-in clcache (MSVC), under .nuitka-cache.
    #   - Linux  : ccache installed in the container, CCACHE_DIR pinned to
    #              .nuitka-cache/ccache (see docker-build.sh) with
    #              CCACHE_COMPILERCHECK=content.
    # sccache stays removed: Linux incremental builds served by sccache
    # crashed with codeobject.c:250 in the past.
    #
    # IMPORTANT: the Nuitka cache must be keyed PER DISTRO (and per image
    # digest). Compiled objects carry glibc requirements from their build
    # container; sharing cache entries across distros would poison them.

    steps:
      - uses: actions/checkout@v4

      # === Toolchain identity (docker): pin the exact image for this run ===
      - name: Resolve container image
        id: image
        if: matrix.build_mode == 'docker'
        run: |
          docker pull "ubuntu:${{ matrix.distro }}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "ubuntu:${{ matrix.distro }}" | sed 's/.*@sha256://')
          echo "Image ubuntu:${{ matrix.distro }} sha256:$digest"
          echo "short=${digest:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Python (host mode only)
        if: matrix.build_mode == 'host'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # === Python dependency cache ===
      # EXACT key only (no restore-keys): when pyproject.toml changes, the
      # venv is rebuilt from scratch, so removed packages (pandas/numpy)
      # cannot survive in a restored venv. Docker mode additionally checks a
      # fingerprint inside the container (docker-build.sh).
      - name: Cache Virtual Environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: venv
          key: venv-v2-${{ env.TARGET_ID }}-py311-${{ hashFiles('pyproject.toml') }}

      # Docker mode: python-build-standalone is installed INSIDE the container
      # under /work (mounted repo), so the host-side cache works.
      - name: Cache Standalone Python (uv)
        if: matrix.build_mode == 'docker'
        uses: actions/cache@v4
        with:
          path: .uv-python
          key: uv-python-${{ env.TARGET_ID }}-3.11

      # Host mode: create (only when not restored) and install deps.
      - name: Install Dependencies (host runner)
        if: matrix.build_mode == 'host'
        shell: bash
        run: |
          if [ ! -x venv/Scripts/python.exe ]; then
            rm -rf venv
            python -m venv venv
          fi
          echo "${{ github.workspace }}/venv/Scripts" >> "$GITHUB_PATH"
          venv/Scripts/python.exe -m pip install --upgrade pip
          venv/Scripts/python.exe -m pip install -e ".[dev]"
          if venv/Scripts/python.exe -c "import importlib.util, sys; sys.exit(0 if any(importlib.util.find_spec(m) for m in ('pandas', 'numpy')) else 1)"; then
            echo "[-] pandas/numpy present in the build venv"
            exit 1
          fi

      # === Cache Nuitka artifacts (analysis + ccache/clcache objects) ===
      # Unique save key per run AND attempt (re-runs save their new objects
      # too); restore falls back from the same inputs to the same image to
      # the same target. Targets never share entries.
      - name: Cache Nuitka Artifacts
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: build-cache-v6-${{ env.TARGET_ID }}-${{ steps.image.outputs.short || 'host' }}-${{ hashFiles('pyproject.toml', 'mk/make.py', 'mk/postbuild.py', 'mk/config/build.config', '.github/scripts/docker-build.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-cache-v6-${{ env.TARGET_ID }}-${{ steps.image.outputs.short || 'host' }}-${{ hashFiles('pyproject.toml', 'mk/make.py', 'mk/postbuild.py', 'mk/config/build.config', '.github/scripts/docker-build.sh') }}-
            build-cache-v6-${{ env.TARGET_ID }}-${{ steps.image.outputs.short || 'host' }}-
            build-cache-v6-${{ env.TARGET_ID }}-

      - name: Restored cache size
        shell: bash
        run: du -sh .nuitka-cache 2>/dev/null || echo "no Nuitka cache restored"

      # === Make (host mode) ===
      - name: Build with Nuitka (host runner)
        if: matrix.build_mode == 'host'
        shell: bash
        env:
          # Full computed tag (with dev/ci suffix) becomes the build version:
          # binary build_info, version.txt and artifact naming all use it.
          DANDELION_VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          start=$(date +%s)
          python mk/make.py all
          echo "build_seconds=$(( $(date +%s) - start ))"
          echo "clcache size after build: $(du -sh .nuitka-cache/clcache 2>/dev/null | cut -f1 || echo n/a)"

      # === Make (docker mode): build inside the target distro container ===
      - name: Build with Nuitka (Docker ${{ matrix.distro_label }})
        if: matrix.build_mode == 'docker'
        env:
          # Pass the computed tag through env, not shell interpolation:
          # tag names may legally contain shell metacharacters ($(), ``, ;).
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -e DANDELION_VERSION="$RELEASE_TAG" \
            -e DANDELION_TARGET="${{ matrix.distro }}" \
            -e DANDELION_STRIP=1 \
            -e CCACHE_MAXSIZE \
            -w /work \
            "ubuntu:${{ matrix.distro }}" \
            bash .github/scripts/docker-build.sh

      # === Package the final archive (single source of truth) ===
      - name: Package archive
        id: pack
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          PLATFORM: ${{ matrix.build_mode == 'host' && 'windows' || 'linux' }}
        run: |
          echo "=== Top-level layout ==="
          ls -la build/dandelion
          # python3 can be the Microsoft Store stub on Windows runners.
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          "$PY" .github/scripts/package.py pack \
            --src build/dandelion --out-dir dist \
            --target-id "$TARGET_ID" --version "$RELEASE_TAG" \
            --platform "$PLATFORM" --github-output "$GITHUB_OUTPUT"
          echo "### $TARGET_ID" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist >> "$GITHUB_STEP_SUMMARY"

      # === Smoke Test (Windows): the zip, unpacked into a fresh directory ===
      # PATH is reduced to the system directories so the build venv / host
      # Python cannot satisfy imports for the artifact.
      - name: Smoke Test (host runner, final archive)
        if: matrix.build_mode == 'host'
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          python .github/scripts/package.py verify --archive "dist/$ARCHIVE" --platform windows --sha256-file "dist/$ARCHIVE.sha256"
          rm -rf smoke && mkdir smoke
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "dist/$ARCHIVE" smoke
          cd smoke/dandelion
          ls -la
          clean() { env -u PYTHONPATH -u PYTHONHOME PATH="/usr/bin:/c/Windows/System32:/c/Windows" "$@"; }

          set +e
          OUT=$(clean timeout 60 cmd //c dandelion.cmd --version < /dev/null 2>&1); RC=$?
          set -e
          echo "$OUT"
          OUT=$(echo "$OUT" | tr -d '\r')
          [ "$RC" -eq 0 ] || { echo "[-] --version exited $RC"; exit 1; }
          [ "$OUT" = "$RELEASE_TAG" ] || { echo "[-] --version printed '$OUT', expected '$RELEASE_TAG'"; exit 1; }

          set +e
          OUT=$(clean timeout 180 cmd //c dandelion.cmd --self-test < /dev/null 2>&1); RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -eq 0 ] || { echo "[-] --self-test exited $RC"; exit 1; }
          echo "$OUT" | tr -d '\r' | grep -q "^Self-test OK$" || { echo "[-] --self-test did not report OK"; exit 1; }

          OUT=$(clean timeout 60 cmd //c dandelion.cmd < /dev/null 2>&1 || true)
          echo "$OUT" | head -5
          echo "$OUT" | grep -q "Initializing Dandelion Project" || { echo "[-] Smoke failed: entry did not start"; exit 1; }
          echo "$OUT" | grep -qE "Agent Initialization Successful|Failed to load config" || { echo "[-] Smoke failed: unexpected runtime output"; exit 1; }
          echo "[+] Smoke OK: $ARCHIVE"

      # === Smoke Test (docker mode): the tar.gz, in the target distro ===
      # Host runner glibc is newer, so a host-side run would NOT catch a
      # "GLIBC_x.y not found" regression. Runs as a non-root uid with
      # --network none and without the repo checkout.
      - name: Smoke Test (in target container, final archive)
        if: matrix.build_mode == 'docker'
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          python3 .github/scripts/package.py verify --archive "dist/$ARCHIVE" --platform linux --sha256-file "dist/$ARCHIVE.sha256"
          bash .github/scripts/smoke-test.sh "dist/$ARCHIVE" "${{ matrix.distro }}" "$RELEASE_TAG"

      # Upload ONLY the tested archive + checksum (already compressed, so the
      # artifact layer does not compress again).
      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-${{ env.TARGET_ID }}
          path: |
            dist/${{ steps.pack.outputs.archive }}
            dist/${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0

      # Diagnostics (never released): toolchain identity, ccache usage, strip
      # ledger, manifest and the Nuitka report.
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ env.TARGET_ID }}
          path: |
            build/toolchain.txt
            build/strip-ledger.tsv
            build/nuitka-report.xml
            build/dandelion/bin/MANIFEST.txt
          if-no-files-found: ignore

  # 4. Release Job: verify the complete archive set and attach it unchanged.
  #    Runs only if meta, the contract tests and ALL 11 build legs succeeded
  #    (a failed/cancelled/skipped leg fails the build job -> no release).
  release:
    needs: [meta, test, build]
    if: success() && needs.meta.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Archives
        uses: actions/download-artifact@v4
        with:
          pattern: dandelion-*
          merge-multiple: true
          path: release_assets

      # Exactly one archive per target, same version, digests unchanged since
      # the smoke test, layout + modes re-checked. No unpack/re-zip.
      - name: Verify Release Set
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          EXPECTED_TARGETS: >-
            win-x86_64
            linux-x86_64-ubuntu18
            linux-x86_64-ubuntu20
            linux-x86_64-ubuntu22
            linux-x86_64-ubuntu24
            linux-x86_64-ubuntu26
            linux-aarch64-ubuntu18
            linux-aarch64-ubuntu20
            linux-aarch64-ubuntu22
            linux-aarch64-ubuntu24
            linux-aarch64-ubuntu26
        run: |
          ls -l release_assets
          python3 .github/scripts/package.py verify-set \
            --dir release_assets --version "$RELEASE_TAG" \
            --targets "$EXPECTED_TARGETS" --sums-out release_assets/SHA256SUMS
          cat release_assets/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Release ${{ needs.meta.outputs.tag }}
          files: |
            release_assets/*.tar.gz
            release_assets/*.zip
            release_assets/*.sha256
            release_assets/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
