name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
      - "master"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Meta Job: Calculate version number and tag information
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        env:
          # Pass untrusted ref through env to avoid shell injection via
          # direct expression interpolation (ref names may contain $(), etc.)
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" "$GITHUB_REF_VALUE" || true)

          # If no tag is provided, generate a date-based development version number.
          if [[ $tag != v* ]]; then
            tag="v0.0.0-dev-$(date +%y%m%d)-$(git rev-parse --short HEAD)"
          fi

          # If it is not triggered by a formal release, add the ci suffix.
          if [ "$is_release" != "true" ]; then
             tag="${tag}-ci"
          fi

          echo "Computed Tag: $tag"
          echo "Is Release: $is_release"

          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "is_release=$is_release" >> $GITHUB_OUTPUT

  # 2. Build Job: Build Matrix
  #    - Windows x86_64      : native host runner (unchanged behavior)
  #    - Linux x86_64        : per-distro Docker builds (glibc compatibility)
  #    - Linux arm64 (aarch64): same Docker flow on the arm64 runner
  #
  # WHY DOCKER PER DISTRO: a Nuitka standalone binary links against the
  # build machine's glibc. Building on a newer distro bakes in newer
  # GLIBC_x.y symbols, so the artifact fails on older distros with
  # "version `GLIBC_x.y' not found". Building inside the target distro's
  # own container guarantees the artifact only needs that distro's glibc.
  #
  # GitHub-hosted runner images only cover 22.04/24.04/(26.04 preview), so
  # older targets (18.04/20.04) MUST be built in Docker containers anyway.
  # Using Docker for ALL Linux targets keeps the pipeline deterministic.
  # BOTH architectures get the full 18.04-26.04 distro list; the runner
  # provides the architecture (x86_64 vs arm64 hardware), the container
  # provides the distro version.
  build:
    needs: meta
    name: Build ${{ matrix.os_name }} ${{ matrix.arch }}${{ matrix.distro_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (host runner, Nuitka + MSVC/clcache)
          - os: windows-latest
            os_name: win
            arch: x86_64
            build_mode: host
            distro: ""
            distro_label: ""
          # Linux x86_64: one Docker build per supported Ubuntu version.
          # ubuntu:18.04/20.04 are EOL but their containers still work;
          # docker-build.sh falls back to old-releases.ubuntu.com for apt.
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "18.04"
            distro_label: "-ubuntu18"
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "20.04"
            distro_label: "-ubuntu20"
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "22.04"
            distro_label: "-ubuntu22"
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "24.04"
            distro_label: "-ubuntu24"
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            build_mode: docker
            distro: "26.04"
            distro_label: "-ubuntu26"
          # Linux arm64: same Docker flow, native arm64 image on the arm
          # runner (docker pulls the arm64v8 variant automatically). Same
          # full 18.04-26.04 distro list as x86_64.
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "18.04"
            distro_label: "-ubuntu18"
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "20.04"
            distro_label: "-ubuntu20"
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "22.04"
            distro_label: "-ubuntu22"
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "24.04"
            distro_label: "-ubuntu24"
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            build_mode: docker
            distro: "26.04"
            distro_label: "-ubuntu26"

    # Nuitka C compilation cache: built-in clcache (default). sccache was
    # removed: Linux incremental builds served by sccache crashed with
    # codeobject.c:250, while Windows (clcache) never did.
    #
    # IMPORTANT: the Nuitka cache must be keyed PER DISTRO. Compiled objects
    # carry glibc requirements from their build container; sharing cache
    # entries across distros would poison the artifacts.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (host mode only)
        if: matrix.build_mode == 'host'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # === Cache Mechanism for Python Dependencies ===
      # Docker mode: venv + python-build-standalone are created INSIDE the
      # container under /work (mounted repo), so host-side cache works.
      # 1. Create (host mode only)
      - name: Create Virtual Environment
        if: matrix.build_mode == 'host'
        run: python -m venv venv

      # 2. Activate (Add venv bin dir to PATH; host mode only)
      - name: Activate Virtual Environment
        if: matrix.build_mode == 'host'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "${{ github.workspace }}/venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "${{ github.workspace }}/venv/bin" >> "$GITHUB_PATH"
          fi

      # 3. Cache (venv, isolated per distro)
      - name: Cache Virtual Environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: venv
          key: venv-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            venv-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}-

      # 3b. Cache standalone Python (docker mode only; separate step so the
      #     Windows host job never touches a missing .uv-python path)
      - name: Cache Standalone Python (uv)
        if: matrix.build_mode == 'docker'
        uses: actions/cache@v4
        with:
          path: .uv-python
          key: uv-python-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}-3.11

      # 4. Install Deps (host mode only; docker mode installs in-container)
      - name: Install Dependencies
        if: matrix.build_mode == 'host'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # === Cache Nuitka artifacts (analysis + clcache objects) ===
      - name: Cache Nuitka Artifacts
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: build-cache-v5-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}-${{ hashFiles('pyproject.toml', 'mk/make.py', 'mk/config/build.config') }}-${{ github.sha }}
          restore-keys: |
            build-cache-v5-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}-${{ hashFiles('pyproject.toml', 'mk/make.py', 'mk/config/build.config') }}-
            build-cache-v5-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}-

      # === Make (host mode) ===
      - name: Build with Nuitka (host runner)
        if: matrix.build_mode == 'host'
        shell: bash
        env:
          # Full computed tag (with dev/ci suffix) becomes the build version:
          # binary build_info, version.txt and artifact naming all use it.
          DANDELION_VERSION: ${{ needs.meta.outputs.tag }}
        run: |
          python mk/make.py all

      # === Make (docker mode): build inside the target distro container ===
      - name: Build with Nuitka (Docker ${{ matrix.distro_label }})
        if: matrix.build_mode == 'docker'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -e DANDELION_VERSION="${{ needs.meta.outputs.tag }}" \
            -e DANDELION_TARGET="${{ matrix.distro }}" \
            -w /work \
            "ubuntu:${{ matrix.distro }}" \
            bash .github/scripts/docker-build.sh

      # === Prepare Artifact (name includes the distro suffix) ===
      - name: Prepare Artifact
        shell: bash
        run: |
          ARTIFACT_NAME="dandelion-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}"
          mkdir -p upload_stage

          # Copy build artifact to upload directory
          if [ -d "build/dandelion" ]; then
            cp -r build/dandelion "upload_stage/$ARTIFACT_NAME"
          else
            echo "Error: Build artifact not found in build/dandelion!"
            ls -R build
            exit 1
          fi

          # version.txt is written by mk/make.py with the DANDELION_VERSION tag.

          # Verify top-level layout (hidden dirs and fake entry must survive)
          echo "=== Top-level layout ==="
          ls -la "upload_stage/$ARTIFACT_NAME"
          echo "=== bin/ ==="
          ls "upload_stage/$ARTIFACT_NAME/bin"

      # === Smoke Test (host runner: Windows) ===
      # PYTHONFAULTHANDLER=1: if the binary crashes (SIGSEGV/SIGABRT), dump
      # the Python stack so the crashing import is visible in the log.
      - name: Smoke Test (host runner)
        if: matrix.build_mode == 'host'
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          cd "upload_stage/dandelion-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}"
          if [ "$RUNNER_OS" == "Windows" ]; then
            OUT=$(timeout 60 cmd //c dandelion.cmd < /dev/null 2>&1 || true)
          else
            # Unset LD_LIBRARY_PATH etc.: a foreign libpython from the runner
            # environment would be loaded before the bundled one and crash.
            OUT=$(env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH timeout 60 ./dandelion.sh < /dev/null 2>&1 || true)
          fi
          echo "$OUT" | head -5
          echo "$OUT" | grep -q "Initializing Dandelion Project" || { echo "[-] Smoke failed: entry did not start"; echo "$OUT"; exit 1; }
          echo "$OUT" | grep -qE "Agent Initialization Successful|Failed to load config" || { echo "[-] Smoke failed: unexpected runtime output"; echo "$OUT"; exit 1; }
          echo "[+] Smoke OK: fake entry works, runtime path resolved"

      # === Smoke Test (docker mode: run INSIDE the target distro) ===
      # The real proof that the artifact runs on the distro it was built
      # for. Host runner glibc is newer, so a host-side run would NOT catch
      # a "GLIBC_x.y not found" regression.
      - name: Smoke Test (in target container)
        if: matrix.build_mode == 'docker'
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          cd "upload_stage/dandelion-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}"
          OUT=$(timeout 120 docker run --rm \
            -v "$PWD:/app" -w /app \
            -e PYTHONFAULTHANDLER=1 -e LD_LIBRARY_PATH= -e PYTHONHOME= -e PYTHONPATH= \
            "ubuntu:${{ matrix.distro }}" ./dandelion.sh < /dev/null 2>&1 || true)
          echo "$OUT" | head -5
          echo "$OUT" | grep -q "Initializing Dandelion Project" || { echo "[-] Smoke failed on ${{ matrix.distro_label }}"; echo "$OUT"; exit 1; }
          echo "$OUT" | grep -qE "Agent Initialization Successful|Failed to load config" || { echo "[-] Smoke failed: unexpected runtime output"; echo "$OUT"; exit 1; }
          echo "[+] Smoke OK on ubuntu:${{ matrix.distro }} (max GLIBC_ verified by execution)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.distro_label }}
          path: upload_stage
          include-hidden-files: true

  # 3. Release Job: Release And Upload Assets
  release:
    needs: [meta, build]
    if: needs.meta.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts
        run: |
          RELEASE_DIR="$GITHUB_WORKSPACE/release_assets"
          mkdir -p "$RELEASE_DIR"
          cd artifacts

          # Iterate through each downloaded artifact directory
          for dir in */; do
            dir=${dir%*/} # remove trailing slash
            echo "Processing $dir..."

            # Construct the final zip name: name-os-arch-version.zip
            zip_name="${dir}-${{ needs.meta.outputs.tag }}.zip"

            # Enter directory and zip content (-y preserves symlinks)
            (cd "$dir" && zip -r -y "$RELEASE_DIR/$zip_name" .)
          done

          echo "Assets to upload:"
          ls -l "$RELEASE_DIR"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Release ${{ needs.meta.outputs.tag }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
